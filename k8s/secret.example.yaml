# Template only — do NOT fill in real values here or commit them.
#
# Elasticsearch is external (Elastic Cloud Serverless); these creds are the same
# ones in your gitignored .env.local. Create the real secret imperatively instead
# of editing/applying this file, so nothing sensitive ever touches git:
#
#   kubectl create secret generic hawker-es \
#     --from-literal=ELASTICSEARCH_URL='https://your-project.es.region.gcp.elastic.cloud:443' \
#     --from-literal=ELASTICSEARCH_API_KEY='your-api-key'
#
# Or, from the existing .env.local without retyping the values:
#
#   export $(grep -v '^#' .env.local | xargs) && \
#   kubectl create secret generic hawker-es \
#     --from-literal=ELASTICSEARCH_URL="$ELASTICSEARCH_URL" \
#     --from-literal=ELASTICSEARCH_API_KEY="$ELASTICSEARCH_API_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: hawker-es
type: Opaque
stringData:
  ELASTICSEARCH_URL: "https://REPLACE-ME.es.region.gcp.elastic.cloud:443"
  ELASTICSEARCH_API_KEY: "REPLACE-ME"
