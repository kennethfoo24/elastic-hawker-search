name: Build and Push Docker Image

# Build-and-push only. Elasticsearch is external (Elastic Cloud Serverless) and read
# at runtime — nothing ES-related is needed at build time, so only Docker Hub
# credentials are required as GitHub secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token, not the password)
# Deploying this image to Cloud Run is a manual `gcloud run deploy` step — see docs/DEPLOY.md
# (or run `npm run deploy` / `scripts/deploy-cloud-run.sh`).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: kennethfoo24/elastic-hawker-search

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
